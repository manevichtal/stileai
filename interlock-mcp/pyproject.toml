[project]
name = "interlock-mcp"
version = "0.1.0"
description = "Interlock — a policy + audit checkpoint for agentic AI, as an MCP server."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27,<2",
    "PyYAML>=6.0",
]

[project.scripts]
interlock-mcp = "interlock.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["interlock"]
